<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plexo Sales Portal Notification</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f3f5f8;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    table {
      border-spacing: 0;
    }

    img {
      border: 0;
      display: block;
    }

    a {
      text-decoration: none;
    }

    @media only screen and (max-width: 620px) {
      .email-wrapper {
        width: 100% !important;
      }

      .content {
        padding: 28px 22px !important;
      }

      .header {
        padding: 22px !important;
      }

      .account-card {
        padding: 18px !important;
      }
    }
  </style>
</head>

<body style="margin:0; padding:0; background-color:#f3f5f8;">

  <!-- Outer Wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
    style="background-color:#f3f5f8; padding:40px 16px;">

    <tr>
      <td align="center">

        <!-- Main Email Container -->
        <table role="presentation" class="email-wrapper" width="600" cellpadding="0" cellspacing="0" border="0" style="
               width:600px;
               max-width:600px;
               background-color:#ffffff;
               border-radius:14px;
               overflow:hidden;
               box-shadow:0 4px 18px rgba(20,35,55,0.08);
             ">

          <!-- ================= HEADER ================= -->
          <tr>
            <td class="header" style="
                padding:24px 32px;
                background-color:#142B4A;
              ">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

                <tr>

                  <!-- Logo / Brand -->
                  <td align="left">

                    <table role="presentation" cellpadding="0" cellspacing="0">

                      <tr>

                        <!-- Logo Icon -->
                        <td valign="middle" style="
                            width:38px;
                            height:38px;
                            background-color:#F4801B;
                            border-radius:10px;
                            text-align:center;
                            vertical-align:middle;
                          ">

                          <span style="
                          color:#ffffff;
                          font-size:18px;
                          font-weight:bold;
                          font-family:Arial, Helvetica, sans-serif;
                        ">
                            P
                          </span>

                        </td>

                        <!-- Brand Name -->
                        <td style="padding-left:12px;">

                          <div style="
                          color:#ffffff;
                          font-size:18px;
                          line-height:22px;
                          font-weight:bold;
                        ">
                            Plexo
                          </div>

                          <div style="
                          color:#AEBBCB;
                          font-size:11px;
                          line-height:16px;
                          letter-spacing:0.4px;
                        ">
                            SALES PORTAL
                          </div>

                        </td>

                      </tr>

                    </table>

                  </td>

                  <!-- Portal Label -->
                  <td align="right" style="
                      color:#C8D2DE;
                      font-size:12px;
                      font-weight:500;
                    ">
                    Representative Portal
                  </td>

                </tr>

              </table>

            </td>
          </tr>


          <!-- ================= ORANGE ACCENT ================= -->
          <tr>
            <td style="
            height:4px;
            line-height:4px;
            font-size:4px;
            background-color:#F4801B;
          ">
              &nbsp;
            </td>
          </tr>


          <!-- ================= MAIN CONTENT ================= -->
          <tr>
            <td class="content" style="padding:42px 42px 38px 42px;">

              <!-- Notification Icon -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:22px;">

                <tr>
                  <td style="
                  width:54px;
                  height:54px;
                  background-color:#FFF3E8;
                  border-radius:50%;
                  text-align:center;
                  vertical-align:middle;
                ">

                    <span style="
                    font-size:25px;
                    line-height:54px;
                  ">
                      📩
                    </span>

                  </td>
                </tr>

              </table>


              <!-- Heading -->
              <h1 style="
              margin:0 0 12px 0;
              color:#142B4A;
              font-size:28px;
              line-height:34px;
              font-weight:700;
              letter-spacing:-0.4px;
              font-family:Arial, Helvetica, sans-serif;
            ">
                {{Title}}
              </h1>


              <!-- Description -->
              <p style=" margin:0 0 30px 0; color:#657180; font-size:15px; line-height:24px; font-family:Arial, Helvetica, sans-serif;  ">
                You've received a new message via the Plexo Sales Portal.
              </p>


              <!-- ================= DETAILS CARD ================= -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="account-card"
                style=" background-color:#F7F9FB; border:1px solid #E5E9EE; border-radius:10px;  margin-bottom:20px; ">

                <tr>

                  <td style="padding:20px 22px;">

                    <p style=" margin:0 0 16px 0; color:#142B4A; font-size:13px;font-weight:bold; text-transform:uppercase;letter-spacing:0.6px; ">
                      Details
                    </p>

                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      {{FieldsRows}}
                    </table>

                  </td>

                </tr>

              </table>


              <!-- ================= MESSAGE ================= -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="
                     background-color:#F7F9FB;
                     border:1px solid #E5E9EE;
                     border-radius:10px;
                   ">

                <tr>

                  <td style="padding:20px 22px;">

                    <p style=" margin:0 0 10px 0; color:#142B4A; font-size:13px;font-weight:bold; text-transform:uppercase;letter-spacing:0.6px; ">
                      Message
                    </p>

                    <p style="
                      margin:0;
                      color:#333F4D;
                      font-size:14px;
                      line-height:22px;
                      font-family:Arial, Helvetica, sans-serif;
                    ">
                      {{Message}}
                    </p>

                  </td>

                </tr>

              </table>

            </td>
          </tr>


          <!-- ================= FOOTER ================= -->
          <tr>

            <td style="
            background-color:#F7F8FA;
            border-top:1px solid #E8EBEF;
            padding:22px 32px;
            text-align:center;
          ">

              <p style="
              margin:0 0 6px 0;
              color:#657180;
              font-size:12px;
              line-height:18px;
              font-weight:600;
              font-family:Arial, Helvetica, sans-serif;
            ">
                Plexo Sales Portal
              </p>

              <p style="
              margin:0;
              color:#9AA3AD;
              font-size:11px;
              line-height:17px;
              font-family:Arial, Helvetica, sans-serif;
            ">
                This is an automated message. Please do not reply to this email.
              </p>

            </td>

          </tr>

        </table>

      </td>
    </tr>

  </table>

</body>

</html>
